name: DB Check

on: push

jobs:
  db:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer la base de données
        run: bash db/setup.sh

      - name: Afficher les étudiants
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d tp -c "SELECT * FROM students;"
