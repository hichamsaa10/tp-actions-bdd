name: CI

on:
  push:
  pull_request:

env:
  # Identifiants jetables de la base de test : valables uniquement dans ce job
  DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/tp

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Préparer la base de données
        run: bash db/setup.sh

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python-app/requirements.txt

      - name: Installer les dépendances
        run: pip install -r requirements.txt
        working-directory: python-app

      - name: Lancer les tests
        run: pytest -v
        working-directory: python-app

      - name: Diagnostic base de données
        if: failure()
        run: |
          systemctl status postgresql.service --no-pager || true
          ss -ltnp | grep -E '5432' || true

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Préparer la base de données
        run: bash db/setup.sh

      - name: Installer Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm ci
        working-directory: node-app

      - name: Lancer les tests
        run: npm test
        working-directory: node-app

  java:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Préparer la base de données
        run: bash db/setup.sh

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Compiler et tester
        run: mvn -B package
        working-directory: java-app
